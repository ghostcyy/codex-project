services:
  postgres:
    image: postgres:16-alpine
    container_name: personal-ai-site-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_ai_site
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d personal_ai_site"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

